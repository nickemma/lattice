name: lattice-multinode

# A three-data-node OpenSearch cluster for the partial-results experiment.
#
# The default deploy/docker-compose.yaml runs OpenSearch in single-node mode.
# That is right for development, but it makes the availability experiment
# impossible: stopping the only data node stops the cluster, so there is no
# state in which the API is up and a shard is missing. This overlay exists so
# that state can be produced.
#
# The index is created with 3 primary shards and 0 replicas. Zero replicas is
# deliberate: with a replica available OpenSearch would simply route around the
# stopped node and coverage would stay complete, which is correct behaviour and
# the wrong experiment. With no replica, one stopped data node means one shard
# has no copy anywhere, and _shards.successful must fall below _shards.total.
#
#   docker compose -f deploy/docker-compose.multinode.yaml up -d --build
#   bash scripts/partial-results-opensearch.sh
#   docker compose -f deploy/docker-compose.multinode.yaml down -v

# Resource caps are mandatory here, not tuning. This overlay is normally run on
# a development laptop alongside an editor, and three unconstrained OpenSearch
# nodes will take the machine with them: a JVM's footprint is roughly double its
# heap once metaspace, thread stacks, and Lucene's off-heap buffers are counted,
# so three nodes at -Xmx512m measured 3.2 GiB resident and pushed an 8 GiB host
# into swap. Swap is what turns a slow editor into an unresponsive one.
#
# 256m heap is ample for the corpus this experiment uses (tens of thousands of
# small documents). The caps below hold the whole cluster near 2 GiB and 4 cores,
# leaving the rest of the machine usable.
x-opensearch-node: &opensearch-node
  image: opensearchproject/opensearch:2.17.1
  environment: &opensearch-env
    cluster.name: lattice-multinode
    discovery.seed_hosts: opensearch-1,opensearch-2,opensearch-3
    cluster.initial_cluster_manager_nodes: opensearch-1,opensearch-2,opensearch-3
    bootstrap.memory_lock: "true"
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    DISABLE_SECURITY_PLUGIN: "true"
    OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
  # mem_limit and cpus are the non-swarm Compose keys; deploy.resources is
  # ignored outside swarm and would silently cap nothing.
  mem_limit: 768m
  # 1.5 rather than 1.0: the experiment needs the baseline to stay inside the
  # 200ms deadline, because a saturated baseline is excluded from scoring and a
  # run where everything saturates demonstrates nothing. This still leaves about
  # ten of sixteen cores for the rest of the machine.
  cpus: 1.5
  ulimits:
    memlock: {soft: -1, hard: -1}
    nofile: {soft: 65536, hard: 65536}

services:
  opensearch-1:
    <<: *opensearch-node
    environment:
      <<: *opensearch-env
      node.name: opensearch-1
    ports:
      - "19200:9200"
    volumes:
      - opensearch-1-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40

  opensearch-2:
    <<: *opensearch-node
    environment:
      <<: *opensearch-env
      node.name: opensearch-2
    volumes:
      - opensearch-2-data:/usr/share/opensearch/data

  opensearch-3:
    <<: *opensearch-node
    environment:
      <<: *opensearch-env
      node.name: opensearch-3
    volumes:
      - opensearch-3-data:/usr/share/opensearch/data

  lattice-query:
    build:
      context: ..
    mem_limit: 256m
    cpus: 1.0
    environment:
      LATTICE_ADDR: ":8080"
      OPENSEARCH_URL: http://opensearch-1:9200
      OPENSEARCH_INDEX: lattice-documents
      OPENSEARCH_SHARDS: "3"
      # Zero replicas is the whole point of this overlay: with a replica
      # available, stopping a data node is routed around and coverage correctly
      # stays complete. See SetIndexLayout in the OpenSearch backend.
      OPENSEARCH_REPLICAS: "0"
      # No Redis and no alias. The result cache would serve complete responses
      # recorded before the node was stopped, and an alias swap is not part of
      # this experiment.
    ports:
      - "18080:8080"
    depends_on:
      opensearch-1:
        condition: service_healthy

volumes:
  opensearch-1-data:
  opensearch-2-data:
  opensearch-3-data:
