name: lattice

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "19092:9092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        rpk topic list -X brokers=redpanda:9092 | grep -q '^lattice.documents '
        || rpk topic create -X brokers=redpanda:9092 -p 3 -r 1 lattice.documents
    depends_on:
      redpanda:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      path.repo: /mnt/snapshots
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - opensearch-snapshots:/mnt/snapshots
    depends_on:
      opensearch-snapshot-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch-snapshot-permissions:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-ec", "chmod 0777 /mnt/snapshots"]
    volumes:
      - opensearch-snapshots:/mnt/snapshots

  opensearch-init:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        curl -fsS -X PUT http://opensearch:9200/_snapshot/lattice-local
        -H 'content-type: application/json'
        --data '{"type":"fs","settings":{"location":"/mnt/snapshots","compress":true}}'
    depends_on:
      opensearch:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  lattice-query:
    build:
      context: ..
    environment:
      LATTICE_ADDR: ":8080"
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: lattice-documents
      OPENSEARCH_ALIAS: lattice-documents-read
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: lattice.documents
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  lattice-indexer:
    build:
      context: ..
    entrypoint: ["/lattice-indexer"]
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: lattice-documents
      OPENSEARCH_ALIAS: lattice-documents-read
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: lattice.documents
      KAFKA_GROUP: lattice-indexer
    ports:
      - "19091:9091"
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      opensearch-init:
        condition: service_completed_successfully

volumes:
  redpanda-data:
  opensearch-data:
  opensearch-snapshots:
  redis-data:
