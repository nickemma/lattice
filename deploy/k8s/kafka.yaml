apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattice-kafka
  namespace: lattice
  labels:
    app: lattice-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lattice-kafka
  template:
    metadata:
      labels:
        app: lattice-kafka
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: kafka
          image: bitnami/kafka:3.8
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_CFG_NODE_ID
              value: "0"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: 0@localhost:9093
            - name: KAFKA_CFG_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: PLAINTEXT://lattice-kafka:9092
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
          readinessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: lattice-kafka
  namespace: lattice
spec:
  selector:
    app: lattice-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
