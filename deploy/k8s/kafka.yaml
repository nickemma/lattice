apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattice-kafka
  namespace: lattice
  labels:
    app: lattice-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lattice-kafka
  template:
    metadata:
      labels:
        app: lattice-kafka
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: kafka
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
          command: ["/entrypoint.sh"]
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --smp
            - "1"
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://lattice-kafka:9092
            - --advertise-rpc-addr
            - lattice-kafka:33145
          ports:
            - name: kafka
              containerPort: 9092
          readinessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: lattice-kafka
  namespace: lattice
spec:
  selector:
    app: lattice-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
