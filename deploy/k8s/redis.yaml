apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattice-redis
  namespace: lattice
  labels:
    app: lattice-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lattice-redis
  template:
    metadata:
      labels:
        app: lattice-redis
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: lattice-redis
  namespace: lattice
spec:
  selector:
    app: lattice-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
